apiVersion: v1
kind: Service
metadata:
  name: static-web-service-vinodh
  annotations:
    metallb.io/address-pool: static-web-ec2
    metallb.io/loadBalancerIPs: 172.31.28.107
spec:
  type: LoadBalancer
  loadBalancerClass: india-explorer.io/aws-nlb
  selector:
    app: static-web-vinodh
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30151
